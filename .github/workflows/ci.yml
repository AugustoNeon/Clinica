# CI da aplicacao: lint + typecheck + build.
#
# Complementar ao gdas-advisory.yml, que roda os checks de GOVERNANCA do
# GDAS (senior-baseline, verify, no-agent-attribution) em modo advisory.
# Este aqui e o gate tecnico da stack Next.js e BLOQUEIA: build quebrado
# nao entra na main.
#
# O step de build recebe as 3 vars do Supabase via secret do repositorio
# (Settings > Secrets and variables > Actions) desde 2026-08-05 (Fase 5
# PR1, issue #16): `lib/data/*` deixou de ser mock e as paginas SSG
# (ex.: /servicos/[slug]) consultam o banco durante o build — sem as
# vars, o build falha (decisao registrada no CLAUDE.md, "Decisoes
# fechadas"). `npm run lint`/`npm run typecheck` continuam sem nenhuma
# env var.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      # Valida que o build tambem produz um Worker Cloudflare valido
      # (adaptador @opennextjs/cloudflare). So build, sem deploy: nao
      # exige CLOUDFLARE_API_TOKEN nem dominio, que ainda nao existem
      # (AGENTS.md "Decisoes fechadas", 2026-08-04).
      - name: Cloudflare build check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx opennextjs-cloudflare build

      # PLANEJAMENTO.md secao 6 pede auditoria de dependencia no verify.
      # Advisory por enquanto: as vulnerabilidades abertas hoje sao
      # transitivas do proprio Next.js (postcss/sharp) e so somem quando o
      # Next publicar release corrigida — bloquear aqui pararia o projeto
      # sem dar acao possivel. Promover a bloqueante quando a arvore limpar.
      - name: Dependency audit (advisory)
        if: always()
        run: npm audit --audit-level=high || true
